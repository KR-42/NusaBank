{% extends "base.html" %}
{% block title %}Buka Rekening{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h1>Buka rekening online</h1>
    <p class="sub">Isi data diri Anda. Verifikasi KYC dapat dilakukan setelah masuk.</p>

    <form method="post" novalidate>
      <div class="form-group">
        <label class="form-label" for="full_name">Nama lengkap</label>
        <input class="form-control" id="full_name" name="full_name" required
               value="{{ form.get('full_name', '') }}">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" id="username" name="username" required
                 value="{{ form.get('username', '') }}">
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">No. HP</label>
          <input class="form-control" id="phone" name="phone"
                 value="{{ form.get('phone', '') }}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" required
               value="{{ form.get('email', '') }}">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required>
        <p class="form-hint">Gunakan kombinasi huruf, angka, dan simbol.</p>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm_password">Ulangi password</label>
        <input class="form-control" id="confirm_password" name="confirm_password"
               type="password" required>
      </div>
      <label class="form-check">
        <input type="checkbox" name="terms" required> Saya menyetujui syarat &amp; ketentuan.
      </label>
      <div class="form-actions">
        <button class="btn btn--primary btn--block" type="submit">Buka rekening</button>
      </div>
    </form>

    <p class="small text-center mt-2 mb-0">
      Sudah punya akun? <a href="{{ url_for('auth.login') }}">Masuk</a>
    </p>
  </div>
</section>
{% endblock %}
