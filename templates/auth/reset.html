{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <h1>Atur password baru</h1>
    <p class="sub">Tautan reset: <code class="mono">{{ token }}</code></p>

    <form method="post" novalidate>
      <div class="form-group">
        <label class="form-label" for="password">Password baru</label>
        <input class="form-control" id="password" name="password" type="password" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm_password">Ulangi password baru</label>
        <input class="form-control" id="confirm_password" name="confirm_password"
               type="password" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit">Simpan password</button>
    </form>
  </div>
</section>
{% endblock %}
