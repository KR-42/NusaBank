{% extends "base.html" %}
{% block title %}Ganti Password{% endblock %}

{% block content %}
<section class="section-tight">
  <div class="container">
    <div class="page-head">
      <h1>Ganti password</h1>
      <p class="muted">Gunakan password yang kuat dan tidak dipakai di layanan lain.</p>
    </div>

    <div class="auth-card">
      {# VULN: csrf — on easy/medium the static token is never verified. #}
      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label class="form-label" for="current_password">Password saat ini</label>
          <input class="form-control" id="current_password" name="current_password"
                 type="password" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="new_password">Password baru</label>
          <input class="form-control" id="new_password" name="new_password"
                 type="password" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm_password">Ulangi password baru</label>
          <input class="form-control" id="confirm_password" name="confirm_password"
                 type="password" required>
        </div>
        <div class="form-actions">
          <button class="btn btn--primary" type="submit">Simpan password</button>
          <a class="btn btn--ghost" href="{{ url_for('dashboard.profile') }}">Batal</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
